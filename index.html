<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:,">
<title>ChartLab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Unbounded:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/src/style.css">
</head>
<body>
<div class="app" id="app">
  <!-- ============ TOP BAR ============ -->
  <header class="topbar">
    <div class="brand"><div class="mark">C</div><div class="word">chart<b>lab</b></div></div>
    <div class="symwrap" id="symwrap">
      <input id="sym" class="sym" spellcheck="false" autocomplete="off" placeholder="SYMBOL">
      <div class="symmenu" id="symmenu" hidden></div>
    </div>
    <div class="seg" id="tfbar"></div>
    <div class="divider"></div>
    <div class="seg" id="ctype"></div>
    <div class="divider"></div>
    <button class="iconbtn" id="btnUndo" title="Undo (Ctrl+Z)">↶</button>
    <button class="iconbtn" id="btnRedo" title="Redo (Ctrl+Shift+Z)">↷</button>
    <div class="divider"></div>
    <button class="iconbtn" id="btnLock" title="Lock all drawings">🔒</button>
    <button class="iconbtn" id="btnHide" title="Hide all drawings">👁</button>
    <button class="iconbtn" id="btnRemove" title="Remove all drawings">🗑</button>
    <div class="divider"></div>
    <button class="iconbtn" id="btnKeep" title="Keep drawing mode">∞</button>
    <div class="magnet" id="magnet"><span>🧲</span><select id="magsel" title="Magnet mode">
      <option value="off">magnet off</option>
      <option value="weak" selected>magnet: weak</option>
      <option value="strong">magnet: strong</option>
    </select></div>
    <div class="divider"></div>
    <button class="iconbtn" id="btnInd" title="Indicators — Phase 2 (Pine runtime)">ƒx</button>
    <button class="iconbtn" id="btnCmp" title="Compare — Phase 2">⇄</button>
    <button class="iconbtn" id="btnAlert" title="Alerts — Phase 2">◉</button>
    <div class="spacer"></div>
    <button class="iconbtn" id="btnFit" title="Fit chart (Home)">⛶</button>
    <span class="databadge" id="databadge">mock feed</span>
  </header>

  <!-- ============ LEFT RAIL ============ -->
  <nav class="rail" id="rail"></nav>

  <!-- ============ CHART ============ -->
  <main class="chart" id="chart">
    <canvas id="cv"></canvas>
    <div class="chip" id="chip" hidden></div>
    <div class="modetip" id="modetip" hidden></div>
    <div class="inputpill" id="textinput" hidden>
      <input id="textinputfield" type="text" spellcheck="false">
      <button id="textinputok">↵</button>
    </div>
    <div class="ctxmenu" id="ctxmenu" hidden></div>
    <div class="toast" id="toast" hidden></div>
  </main>
  <div class="dlg" id="dlg" hidden><div class="dlgbox" id="dlgform"></div></div>

  <!-- ============ RIGHT PANEL ============ -->
  <aside class="objpanel">
    <div class="ophead">
      <span class="t">Objects</span>
      <span class="cnt" id="objcnt">0</span>
      <button class="mini" id="btnClearAll" title="Remove all drawings">clear</button>
    </div>
    <input class="opsearch" id="objsearch" placeholder="⌕  filter objects…" spellcheck="false">
    <div class="oplist" id="oplist"></div>
    <div class="opfoot" id="opfoot">layout auto-saved ✓</div>
  </aside>

  <!-- ============ STATUS BAR ============ -->
  <footer class="statusbar" id="statusbar">
    <span class="lbl" id="stSym">—</span>
    <span class="lbl">Open</span><span class="val" id="stO">—</span>
    <span class="lbl">High</span><span class="val" id="stH">—</span>
    <span class="lbl">Low</span><span class="val" id="stL">—</span>
    <span class="lbl">Close</span><span class="val" id="stC">—</span>
    <span class="lbl">Chg</span><span class="val" id="stChg">—</span>
    <span class="right">
      <span class="lbl">bars</span><span class="val" id="stBars">—</span>
      <span class="lbl">drawings</span><span class="val" id="stDrawings">0</span>
      <span class="kbd">esc select · del remove · dblclick settings · ctrl+z undo</span>
    </span>
  </footer>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
